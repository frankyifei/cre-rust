[workspace]
resolver = "2"
members = [
    "crates/cre-blitz-spike",
    "crates/cre-epub", "crates/cre-fb2",
    "crates/cre-ffi",
    "crates/cre-lib",
    "crates/cre-paint",
    "crates/cre-render", "crates/cre-text",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.91"

[profile.release]
panic = "unwind"
