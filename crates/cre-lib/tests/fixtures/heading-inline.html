<!DOCTYPE html>
<html>
<head>
<title>Heading</title>
<style>
/* The same rules as `heading-linked.css`, inline: the linked sheet above must
   render exactly like this. */
h1 {
    font-size: x-large;
}

.note {
    font-size: small;
}
</style>
</head>
<body>
<h1>Chapter One</h1>
<p>Body text that follows the heading and wraps a few words at this width.</p>
<p class="note">A note set in a smaller absolute size.</p>
</body>
</html>
