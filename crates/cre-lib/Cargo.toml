[package]
name = "cre-lib"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
vello-cpu = ["cre-paint/vello-cpu"]

[dependencies]
# Chunk HTML is kept for relayouts; a large text book is mostly text, so a fast
# block compressor cuts that resident copy in half.
lz4_flex = "0.11"
base64 = "0.22"
anyhow = "1"
anyrender = "0.14"
parley = { version = "=0.12.0", default-features = false, features = ["complex-scripts"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = [
    "floats",
    "complex-scripts",
    "text-transform-icu",
    "woff",
    "svg",
] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
cre-book = { path = "../cre-book" }
cre-epub = { path = "../cre-epub" }
cre-fb2 = { path = "../cre-fb2" }
cre-kf8 = { path = "../cre-kf8" }
cre-mathml = { path = "../cre-mathml" }
cre-mobi = { path = "../cre-mobi" }
cre-paint = { path = "../cre-paint" }
cre-text = { path = "../cre-text" }
libc = "0.2"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
percent-encoding = "2"
regex.workspace = true
png = "0.18"
# The only pure-Rust SVG rasteriser. `usvg` (the parser) and `tiny-skia` (the
# backend) are in the graph anyway - `anyrender_svg` and `cre-paint` need them -
# so this adds the renderer itself, plus the raster decoders `raster-images`
# turns on. Measured on the armv7 library: 424 KiB in total, of which 172 KiB is
# the renderer and 252 KiB the gif/webp decoders. Dropping `raster-images` is
# not an option: EPUB covers are commonly an SVG wrapper around an embedded
# JPEG, and without it they render blank.
resvg = { version = "0.48.1", default-features = false, features = [
    "text",
    "system-fonts",
    "raster-images",
] }
url = "2"

[dev-dependencies]
# The integration tests build a synthetic EPUB; nothing in the engine
# reads or writes a zip (that is `cre-epub`'s container).
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Building small EPUBs on the fly for the image-placeholder tests.
