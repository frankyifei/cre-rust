[package]
name = "cre-blitz-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyrender = "0.14"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = [
    "floats",
    "complex-scripts",
    "text-transform-icu",
    "woff",
] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
