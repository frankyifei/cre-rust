[package]
name = "cre-paint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Optional CPU backend with clip layers, opacity/blend and box shadows.
vello-cpu = ["dep:anyrender_vello_cpu", "dep:vello_cpu"]

[dependencies]
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["filters"], optional = true }
vello_cpu = { version = "0.3", optional = true }
ttf-parser = "0.25"
kurbo = "0.13"
peniko = "0.6"
tiny-skia = "0.12"
# Decodes the original pixels of images whose page only carries a size
# placeholder (see `PlacedImage`).
# Decodes JPEGs at the size they are painted at (DCT scaling), instead of
# decoding a 1443x2048 photo into 11 MB of RGBA to shrink it again.
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
